name: Numerical package checks
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r environment-tested.txt
      - run: python run.py verify
      - run: python -m unittest discover -s tests -v
      - run: python run.py replay --output "${{ runner.temp }}/derived-replay"
